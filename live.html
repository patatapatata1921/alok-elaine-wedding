<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Live photos — Alok & Elaine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1d1712; --cream: #faf7f2; --muted: #c9bba8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--cream); font-family: 'Inter', sans-serif; overflow: hidden; cursor: none; }
  .stage { position: fixed; inset: 0; }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 1.2s ease; padding: 3vh 3vw 12vh; }
  .slide.on { opacity: 1; }
  .slide .blur { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) brightness(0.45); }
  .slide img { position: relative; object-fit: contain; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .slide .from { position: absolute; left: 3vw; bottom: 4.5vh; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(1.1rem, 2.2vw, 2rem); color: var(--cream); text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
  .new { position: absolute; top: 3vh; left: 3vw; background: var(--cream); color: var(--bg); font-weight: 600; font-size: clamp(0.8rem, 1.2vw, 1.1rem); padding: 0.35em 0.9em; border-radius: 999px; opacity: 0; transition: opacity 0.6s ease; }
  .new.show { opacity: 1; }
  .qr { position: fixed; right: 2.2vw; bottom: 2.5vh; display: flex; align-items: center; gap: 1rem; background: rgba(250, 247, 242, 0.96); color: #2b2622; padding: 0.8rem 1rem 0.8rem 1.2rem; border-radius: 16px; z-index: 5; }
  .qr p { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(1rem, 1.7vw, 1.6rem); line-height: 1.15; text-align: right; }
  .qr p small { display: block; font-family: 'Inter', sans-serif; font-style: normal; font-size: 0.55em; letter-spacing: 0.1em; text-transform: uppercase; color: #6b6258; margin-top: 0.3rem; }
  #qr { width: clamp(90px, 11vw, 170px); height: clamp(90px, 11vw, 170px); }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; }
  .count { position: fixed; left: 3vw; bottom: 1.2vh; font-size: clamp(0.7rem, 1vw, 0.9rem); color: var(--muted); letter-spacing: 0.08em; z-index: 5; }
  .empty { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1rem; padding: 2rem; }
  .empty h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: clamp(2.5rem, 7vw, 6rem); }
  .empty p { color: var(--muted); font-size: clamp(1rem, 1.8vw, 1.5rem); }
  .start { position: fixed; top: 1.2rem; right: 1.2rem; z-index: 6; font: 600 0.9rem 'Inter', sans-serif; padding: 0.6rem 1.1rem; border-radius: 999px; border: 1px solid var(--cream); background: rgba(0,0,0,0.3); color: var(--cream); cursor: pointer; }
  body.full .start { display: none; }
  body:not(.full) { cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="new" id="new">New photo ✨</div>
<div class="empty" id="empty">
  <h1>Alok &amp; Elaine</h1>
  <p>Scan the code to share your photos — they'll appear here.</p>
</div>
<div class="qr">
  <p>Share your photos<small>Scan with your camera</small></p>
  <div id="qr"></div>
</div>
<div class="count" id="count"></div>
<button class="start" id="start" type="button">Full screen</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // EDIT ME: paste the same photos Apps Script "Web app URL" as in upload.html
  const PHOTO_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyFS_PpVeda2ZVm6Rjw7pd7eeFpPAtoBZfvHr6iCef1q3NRoaekHTEYJKOIEWXxEyHY/exec';
  // Alok & Elaine's own photos (Lijiang shoot + the horse shoot) keep the screen going
  // between guest uploads, and fill it before any arrive.
  const COUPLE = '5046 5048 4637 4712 4715 4804 4854 4943 4433 4444 4585 4599 4270 4319 4347 4359 4398 4412 4999 5006 5028 3882 3900 3968 3986 4016 4039 4106 4140 4154 4193 4199 4223 3833 3874 3604 3649 3759 3801 3816 h5570 h5572 h5640 h5681 h5703 h5728 h5903 h5929 h5919 h6039 h6056'.split(' ').map(id => 'images/gallery/lj-' + id + '.jpg');
  const SHOW_SECONDS = 7;      // each photo stays this long
  const CHECK_SECONDS = 20;    // how often to look for new uploads

  const params = new URLSearchParams(location.search);
  const code = params.get('c') || 'kerala2027';
  const MOCK = params.get('mock') === '1';
  const uploadUrl = new URL('upload.html?c=' + encodeURIComponent(code), location.href).href;
  if (window.QRCode) new QRCode(document.getElementById('qr'), { text: uploadUrl, width: 340, height: 340, colorDark: '#2b2622', colorLight: '#faf7f2', correctLevel: QRCode.CorrectLevel.M });

  const stage = document.getElementById('stage');
  const known = new Map();   // id -> {id, from}
  let order = [];            // ids in the order they arrived
  let fresh = [];            // new arrivals, shown next
  let pos = -1, current = null;
  const ours = COUPLE.slice().sort(() => Math.random() - 0.5);   // shuffled once per start
  let oursPos = -1, turn = 0, primed = false;   // photos already there at start aren't "new"

  const src = id => MOCK || id.startsWith('images/') ? id : 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w2000';

  async function check() {
    try {
      let files;
      if (MOCK) {
        const n = Math.min(3 + Math.floor((Date.now() / 1000) % 60 / 10), 8);
        files = ['lj-4193', 'lj-h5728', 'lj-3801', 'lj-h5919', 'lj-4637', 'lj-h5570', 'lj-4016', 'lj-h6056'].slice(0, n)
          .map((f, i) => ({ id: 'images/gallery/' + f + '.jpg', from: i % 2 ? 'Wei Ming' : '' }));
      } else {
        const r = await fetch(PHOTO_ENDPOINT + '?action=list&code=' + encodeURIComponent(code) + '&t=' + Date.now());
        const j = await r.json();
        if (!j.ok) return;
        files = j.files;
      }
      const ids = new Set(files.map(f => f.id));
      // photos moved to "Hidden" (or deleted) drop out of the show
      order = order.filter(id => ids.has(id));
      fresh = fresh.filter(id => ids.has(id));
      files.forEach(f => {
        if (!known.has(f.id)) {
          known.set(f.id, f);
          (primed ? fresh : order).push(f.id);
        }
      });
      [...known.keys()].forEach(id => { if (!ids.has(id)) known.delete(id); });
      document.getElementById('count').textContent = known.size ? known.size + (known.size === 1 ? ' photo shared' : ' photos shared') : '';
      primed = true;
    } catch (e) { /* offline for a moment: keep showing what we have */ }
  }

  function next() {
    let id, isNew = false;
    // new uploads first; otherwise two guest photos, then one of ours (only ours if none yet)
    if (fresh.length) { id = fresh.shift(); order.push(id); pos = order.length - 1; isNew = true; }
    else if (order.length && turn++ % 3 !== 2) { pos = (pos + 1) % order.length; id = order[pos]; }
    else { oursPos = (oursPos + 1) % ours.length; id = ours[oursPos]; }
    if (!id) { current = null; return; }
    const f = known.get(id) || { from: '' };
    const img = new Image();
    img.referrerPolicy = 'no-referrer';   // Google Drive refuses images when it sees the website's address
    img.onload = () => show(img, f, isNew);
    img.onerror = () => { current = current || null; setTimeout(next, 500); };
    img.src = src(id);
  }

  function show(img, f, isNew) {
    const s = document.createElement('div');
    s.className = 'slide';
    const blur = document.createElement('div'); blur.className = 'blur'; blur.style.backgroundImage = `url("${img.src}")`;
    s.appendChild(blur); s.appendChild(img);
    if (f.from) { const p = document.createElement('div'); p.className = 'from'; p.textContent = '📷 ' + f.from; s.appendChild(p); }
    stage.appendChild(s);
    fit(s, img);
    requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('on')));
    const old = current; current = s;
    if (old) { old.classList.remove('on'); setTimeout(() => old.remove(), 1400); }
    document.getElementById('new').classList.toggle('show', isNew);
    clearTimeout(window.__t); window.__t = setTimeout(next, SHOW_SECONDS * 1000);
  }

  // every photo fills the screen the same way, however big the original was
  function fit(s, img) {
    const cs = getComputedStyle(s);
    const w = s.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = s.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const k = Math.min(w / img.naturalWidth, h / img.naturalHeight);
    img.style.width = Math.round(img.naturalWidth * k) + 'px';
    img.style.height = Math.round(img.naturalHeight * k) + 'px';
  }
  window.addEventListener('resize', () => { if (current) fit(current, current.querySelector('img')); });

  document.getElementById('start').addEventListener('click', () => {
    (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || (() => {})).call(document.documentElement);
  });
  document.addEventListener('fullscreenchange', () => document.body.classList.toggle('full', !!document.fullscreenElement));
  // keep the TV awake
  (async () => { try { await navigator.wakeLock.request('screen'); } catch (e) {} })();

  document.getElementById('empty').hidden = true;
  next();
  if (PHOTO_ENDPOINT || MOCK) { check(); setInterval(check, CHECK_SECONDS * 1000); }
</script>
</body>
</html>
